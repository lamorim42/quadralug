name: quadralug

x-backend-image: &backend-image
  image: quadralug-backend:${IMAGE_TAG:-dev}

x-database-env: &database-env
  DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  migrate:
    <<: *backend-image
    pull_policy: never
    working_dir: /app/services/backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      <<: *database-env
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      <<: *database-env
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - internal
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 5s

  bff:
    image: quadralug-bff:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 5s

  web:
    image: quadralug-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - public
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 3s

networks:
  public:
  internal:
  data:
    internal: true

volumes:
  db-data:

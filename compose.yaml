name: quadralug

x-backend-image: &backend-image
  image: quadralug-backend:${IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: services/backend/Dockerfile

x-database-env: &database-env
  DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

x-observability-env: &observability-env
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

# Sonda a cada 2 s na subida e a cada 30 s depois dela.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 4s
  retries: 3
  start_period: 60s
  start_interval: 2s

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent --password=\"$$MYSQL_ROOT_PASSWORD\""]

  migrate:
    <<: *backend-image
    working_dir: /app/services/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-env
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-image
    environment:
      <<: [*database-env, *observability-env]
    networks:
      - internal
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]

  bff:
    image: quadralug-bff:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    environment:
      <<: *observability-env
      BACKEND_URL: http://backend:8000
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]

  web:
    image: quadralug-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - public
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]

networks:
  public:
  internal:
  data:
    internal: true

volumes:
  db-data:

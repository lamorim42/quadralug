[project]
name = "quadralug-bff"
version = "0.0.0"
description = "Fronteira do navegador do Quadralug"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "quadralug-observability",
    "uvicorn",
]

[tool.uv.sources]
quadralug-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadralug_bff"]

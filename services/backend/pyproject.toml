[project]
name = "quadralug-backend"
version = "0.0.0"
description = "API de domínio do Quadralug"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "cryptography",
    "fastapi",
    "pymysql",
    "quadralug-observability",
    "sqlalchemy",
    "uvicorn",
]

[tool.uv.sources]
quadralug-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadralug_backend"]

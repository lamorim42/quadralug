[project]
name = "quadralug-backend"
version = "0.0.0"
description = "API de domínio do Quadralug"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "cryptography",
    "fastapi",
    "pymysql",
    "quadralug-observability[database]",
    # A instrumentação OTel só aceita sqlalchemy < 2.1 e, fora disso, desliga sozinha.
    "sqlalchemy>=2.0,<2.1",
    "uvicorn",
]

[tool.uv.sources]
quadralug-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadralug_backend"]

# O mutmut só importa o código mutado com o pacote inteiro em `src`.
[tool.mutmut]
source_paths = ["src"]
do_not_mutate = [
    "src/quadralug_backend/*/infrastructure/*",
    "src/quadralug_backend/*/interface/*",
    "src/quadralug_backend/shared/*",
    "src/quadralug_backend/main.py",
    "src/quadralug_backend/__main__.py",
]
pytest_add_cli_args_test_selection = ["tests"]
